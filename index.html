  <style>
    :root {
      --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #030408;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    }

    /* High-Contrast Apple Frosted Glass (Dark core so white text is 100% crisp) */
    .apple-glass {
      background: linear-gradient(145deg, rgba(22, 25, 38, 0.82) 0%, rgba(10, 12, 20, 0.88) 100%);
      backdrop-filter: blur(48px) saturate(190%);
      -webkit-backdrop-filter: blur(48px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.38),
        0 32px 90px rgba(0, 0, 0, 0.85);
    }

    /* Final Portal Overlay */
    #final-portal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
      filter: blur(18px);
      transition:
        opacity 0.65s var(--ease-apple),
        transform 0.75s var(--ease-apple),
        filter 0.65s var(--ease-apple);
    }
    #final-portal.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      filter: blur(0px);
    }

    #progress-line {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #38bdf8, #f59e0b, #ec4899);
      width: 0%;
      z-index: 40;
    }
  </style>
</head>

    const easeOutExpo = (x) => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
    const easeOutBack = (x) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };
    const easeInOutCubic = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

    let smoothAmp = 0;
    let dustParticles = [];
    let dustSpawned = false;

    function initDustParticles() {
      dustParticles = [];
      for (let i = 0; i < 480; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 15;
        dustParticles.push({
          x: W * 0.5 + (Math.random() - 0.5) * Math.min(W * 0.65, 580),
          y: H * 0.5 + (Math.random() - 0.5) * 100,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 1.5 + Math.random() * 3.8,
          life: 1.0,
          decay: 0.009 + Math.random() * 0.014,
          hue: Math.random() > 0.3 ? 40 : 195
        });
      }
    }

    // ========================================================================
    // 1. OUTER VIGNETTE VOICE REACTION (Siri / Apple Intelligence Edge Glow)
    //    Center remains dark and clean so typography is 100% readable!
    // ========================================================================
    function drawOuterVoiceVignette(amp, t, alertRed = 0) {
      ctx.save();
      const edgeDepth = Math.min(W, H) * (0.18 + amp * 0.22 + alertRed * 0.25);

      // Top, Bottom, Left, Right perimeter reactive vignette gradients
      const cPrimary = alertRed > 0.05
        ? `rgba(244, 63, 94, ${0.45 * alertRed + amp * 0.35})`
        : `rgba(56, 189, 248, ${0.14 + amp * 0.42})`;
      const cSecondary = alertRed > 0.05
        ? `rgba(225, 29, 72, ${0.40 * alertRed + amp * 0.30})`
        : `rgba(245, 158, 11, ${0.12 + amp * 0.38})`;

      // Top vignette
      const gTop = ctx.createLinearGradient(0, 0, 0, edgeDepth);
      gTop.addColorStop(0, cPrimary);
      gTop.addColorStop(1, 'rgba(3, 4, 8, 0)');
      ctx.fillStyle = gTop;
      ctx.fillRect(0, 0, W, edgeDepth);

      // Bottom vignette
      const gBot = ctx.createLinearGradient(0, H, 0, H - edgeDepth);
      gBot.addColorStop(0, cSecondary);
      gBot.addColorStop(1, 'rgba(3, 4, 8, 0)');
      ctx.fillStyle = gBot;
      ctx.fillRect(0, H - edgeDepth, W, edgeDepth);

      // Left vignette
      const gLeft = ctx.createLinearGradient(0, 0, edgeDepth, 0);
      gLeft.addColorStop(0, cSecondary);
      gLeft.addColorStop(1, 'rgba(3, 4, 8, 0)');
      ctx.fillStyle = gLeft;
      ctx.fillRect(0, 0, edgeDepth, H);

      // Right vignette
      const gRight = ctx.createLinearGradient(W, 0, W - edgeDepth, 0);
      gRight.addColorStop(0, cPrimary);
      gRight.addColorStop(1, 'rgba(3, 4, 8, 0)');
      ctx.fillStyle = gRight;
      ctx.fillRect(W - edgeDepth, 0, edgeDepth, H);

      // Living Voice-Reactive Outer Perimeter Wave Frame (hugs the outer edges of the screen!)
      const pad = 18 + amp * 16;
      ctx.strokeStyle = alertRed > 0.05
        ? `rgba(244, 63, 94, ${0.65 + amp * 0.3})`
        : `rgba(255, 255, 255, ${0.16 + amp * 0.45})`;
      ctx.lineWidth = 2 + amp * 3;
      ctx.shadowColor = alertRed > 0.05 ? '#f43f5e' : '#38bdf8';
      ctx.shadowBlur = 16 + amp * 28;

      // Top & Bottom living border waves
      for (const isBottom of [false, true]) {
        const baseY = isBottom ? H - pad : pad;
        const dir = isBottom ? -1 : 1;
        ctx.beginPath();
        const steps = 64;
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const x = pad + u * (W - pad * 2);
          const bell = Math.sin(Math.PI * u);
          const wave = Math.sin(u * 14 - t * 11 + (isBottom ? 2 : 0)) * (3 + amp * 26) * bell;
          const y = baseY + dir * Math.abs(wave);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      ctx.restore();
    }

    // Helper: Precision Outer Ring / Gear (placed around cards or in background corners, never muddying text)
    function drawGearWheel(cx, cy, radius, teeth, angle, color, alpha, lineWidth = 2) {
      if (alpha <= 0.01 || radius <= 2) return;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;

      ctx.beginPath();
      for (let i = 0; i < teeth; i++) {
        const a0 = (i / teeth) * Math.PI * 2;
        const a1 = ((i + 0.42) / teeth) * Math.PI * 2;
        ctx.arc(0, 0, radius, a0, a1);
      }
      ctx.stroke();

      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const a = (i / (teeth * 2)) * Math.PI * 2;
        const rIn = radius * 0.88;
        const rOut = radius * (i % 2 === 0 ? 0.95 : 0.91);
        ctx.moveTo(Math.cos(a) * rIn, Math.sin(a) * rIn);
        ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Helper: Apple High-Contrast Frosted Glass Card (Dark translucent body so white text is 100% legible)
    function drawAppleCard(cx, cy, w, h, radius, title, subtitle, scale, alpha, accentColor = 'rgba(255,255,255,0.32)', badgeText = '') {
      if (alpha <= 0.01 || scale <= 0.02) return;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.globalAlpha = clamp(alpha, 0, 1);

      // Deep shadow for separation
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 45;
      ctx.shadowOffsetY = 18;

      // Dark Apple frosted glass fill (high contrast for white text!)
      const grad = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
      grad.addColorStop(0, 'rgba(24, 28, 42, 0.92)');
      grad.addColorStop(0.5, 'rgba(12, 15, 24, 0.95)');
      grad.addColorStop(1, 'rgba(20, 24, 38, 0.92)');
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, radius);
      ctx.fill();

      // Clean specular border
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 0;
      ctx.shadowColor = accentColor;
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // Top inner Apple glass rim highlight
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-w * 0.36, -h / 2 + 1);
      ctx.lineTo(w * 0.36, -h / 2 + 1);
      ctx.stroke();

      // Optional top eyebrow / badge
      if (badgeText) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `600 11px -apple-system, 'Inter', sans-serif`;
        ctx.fillText(badgeText.toUpperCase(), 0, -h * 0.30, w * 0.86);
      }

      // Crisp White Apple Title
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const titleSize = Math.min(w * 0.115, subtitle ? h * 0.31 : h * 0.42);
      ctx.font = `700 ${Math.max(15, Math.floor(titleSize))}px -apple-system, 'SF Pro Display', 'Inter', sans-serif`;
      const titleY = badgeText ? (subtitle ? -h * 0.03 : h * 0.06) : (subtitle ? -h * 0.11 : 0);
      ctx.fillText(title, 0, titleY, w * 0.88);

      if (subtitle) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.68)';
        const subSize = Math.max(12, Math.floor(titleSize * 0.50));
        ctx.font = `500 ${subSize}px -apple-system, 'Inter', sans-serif`;
        ctx.fillText(subtitle, 0, badgeText ? h * 0.25 : h * 0.22, w * 0.88);
      }

      ctx.restore();
    }

    // Helper: Living Connecting Spline Line
    function drawLivingSpline(x0, y0, x1, y1, progress, amp, t, color = '#38bdf8', width = 2.5) {
      if (progress <= 0.01) return;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14 + amp * 20;
      ctx.lineCap = 'round';

      const segs = 32;
      const maxSeg = Math.floor(segs * clamp(progress, 0, 1));
      ctx.beginPath();
      for (let i = 0; i <= maxSeg; i++) {
        const u = i / segs;
        const px = x0 + (x1 - x0) * u;
        const py = y0 + (y1 - y0) * u;
        const envBell = Math.sin(Math.PI * u);
        const wave = Math.sin(u * 10 - t * 12) * (4 + amp * 22) * envBell;
        const dx = x1 - x0, dy = y1 - y0;
        const len = Math.hypot(dx, dy) + 1e-5;
        const nx = -dy / len, ny = dx / len;
        const fx = px + nx * wave;
        const fy = py + ny * wave;
        if (i === 0) ctx.moveTo(fx, fy);
        else ctx.lineTo(fx, fy);
      }
      ctx.stroke();

      const uHead = clamp(progress, 0, 1);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x0 + (x1 - x0) * uHead, y0 + (y1 - y0) * uHead, width * 1.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function renderCinema() {
      const t = audio.currentTime || 0;
      progressLine.style.width = Math.min(100, (t / TOTAL_DURATION) * 100) + '%';

      const envIdx = Math.min(VOICE_ENV.length - 1, Math.max(0, Math.floor(t * 40)));
      const rawAmp = (!audio.paused && t < TOTAL_DURATION) ? (VOICE_ENV[envIdx] || 0) : 0;
      smoothAmp += (rawAmp - smoothAmp) * 0.28;
      const amp = smoothAmp;

      if (t >= 60.40) {
        finalPortal.classList.add('active');
      } else {
        finalPortal.classList.remove('active');
      }

      // Clear deep dark Apple background
      ctx.fillStyle = '#030408';
      ctx.fillRect(0, 0, W, H);

      const minDim = Math.min(W, H);
      const cx = W * 0.5;
      const cy = H * 0.5;

      // Is NDA System Error active? (45.98s - 47.05s)
      const isNdaError = (t >= 45.98 && t < 47.05) ? 1.0 : 0.0;

      // Draw Outer Vignette Voice Reaction (hugs the edges of the screen, keeping center crisp!)
      drawOuterVoiceVignette(amp, t, isNdaError);

      // Subtle outer precision ring near the perimeter (outside the text zone!)
      drawGearWheel(cx, cy, minDim * (0.45 + amp * 0.02), 40, t * 0.08, 'rgba(255, 255, 255, 0.10)', 0.6, 1.2);

      // ======================================================================
      // SCENE CHOREOGRAPHY
      // ======================================================================

      // ----------------------------------------------------------------------
      // ACT 0 (0.00s - 4.25s): Document folds -> Line unfolds "Богдан Богданов"
      // ----------------------------------------------------------------------
      if (t < 4.25) {
        if (t < 2.05) {
          const pIn = easeOutBack(prog(t, 0.10, 0.75));
          const pFold = easeInOutCubic(prog(t, 1.25, 2.02));
          const docW = Math.min(320, W * 0.70) * (1 - pFold * 0.90);
          const docH = Math.min(400, H * 0.58) * (1 - pFold * 0.90);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(pIn, pIn);
          ctx.rotate(pFold * Math.PI * 2);

          ctx.fillStyle = `rgba(245, 245, 247, ${1 - pFold * 0.4})`;
          ctx.shadowColor = 'rgba(56, 189, 248, 0.5)';
          ctx.shadowBlur = 30;
          ctx.beginPath();
          ctx.roundRect(-docW / 2, -docH / 2, docW, docH, 18 + pFold * 80);
          ctx.fill();

          if (pFold < 0.6) {
            ctx.fillStyle = '#1d1d1f';
            ctx.textAlign = 'center';
            ctx.font = `700 ${Math.floor(docW * 0.085)}px -apple-system, 'Inter', sans-serif`;
            ctx.fillText('Резюме_Богданов.docx', 0, -docH * 0.25);
            ctx.fillStyle = '#86868b';
            for (let l = 0; l < 5; l++) {
              ctx.fillRect(-docW * 0.34, -docH * 0.08 + l * (docH * 0.09), docW * (l === 4 ? 0.45 : 0.68), 5);
            }
          }
          ctx.restore();
        } else {
          const pLine = easeOutExpo(prog(t, 2.05, 2.68));
          const pUnfold = easeOutBack(prog(t, 2.65, 3.40));
          const pExit = prog(t, 3.90, 4.25);
          const alpha = 1 - pExit;

          const lineSpan = Math.min(W * 0.78, 700) * pLine;
          drawLivingSpline(cx - lineSpan / 2, cy, cx + lineSpan / 2, cy, 1.0, 0.2, t, '#38bdf8', 2.5);
          drawGearWheel(cx, cy, minDim * 0.33 * pUnfold, 24, -t * 1.1, 'rgba(245, 158, 11, 0.45)', alpha, 2);

          if (pUnfold > 0.02) {
            drawAppleCard(
              cx, cy,
              Math.min(W * 0.86, 620), 165, 34,
              'Богдан Богданов',
              'Интерактивное моушн-резюме',
              pUnfold, alpha, 'rgba(255, 255, 255, 0.35)', 'Event Manager'
            );
          }
        }
      }

      // ----------------------------------------------------------------------
      // ACT 1 (4.25s - 7.55s): "Добрый день" -> Line unfolds "Ольга Бортникова"
      // ----------------------------------------------------------------------
      else if (t < 7.55) {
        const pHelloIn = easeOutBack(prog(t, 4.25, 4.65));
        const pShoot = easeInOutCubic(prog(t, 5.05, 5.50));
        const pOlga = easeOutBack(prog(t, 5.30, 5.95));
        const pExit = prog(t, 7.20, 7.55);
        const alpha = 1 - pExit;

        if (t < 5.35) {
          drawAppleCard(
            cx, cy,
            Math.min(W * 0.75, 460), 125, 30,
            'Добрый день.', '',
            pHelloIn * (1 - pShoot * 0.7), 1 - pShoot, 'rgba(56, 189, 248, 0.45)'
          );
        }

        if (t >= 5.05) {
          const span = Math.min(W * 0.82, 720);
          drawLivingSpline(cx - span / 2, cy, cx + span / 2, cy, pShoot, amp, t, '#f59e0b', 2.5);
          drawGearWheel(cx, cy, minDim * 0.35 * pOlga, 28, t * 0.8, 'rgba(56, 189, 248, 0.4)', alpha, 2);

          drawAppleCard(
            cx, cy,
            Math.min(W * 0.88, 660), 175, 36,
            'Ольга Бортникова',
            'lifeevents_agency',
            pOlga, alpha, 'rgba(245, 158, 11, 0.55)', 'Персонально для руководителя'
          );
        }
      }

      // ----------------------------------------------------------------------
      // ACT 2 (7.55s - 18.25s): 4 Qualities -> "Вы его нашли" -> 15 Years Wheel
      // ----------------------------------------------------------------------
      else if (t < 18.25) {
        if (t < 15.50) {
          const pMerge = easeInOutCubic(prog(t, 13.80, 14.60));
          const pFound = easeOutBack(prog(t, 14.50, 15.05));
          const spreadX = Math.min(W * 0.25, 220) * (1 - pMerge);
          const spreadY = Math.min(H * 0.16, 105) * (1 - pMerge);

          const traits = [
            { label: 'Талантливого',   sub: 'Креатив и вкус',   tShow: 7.95,  ox: -spreadX, oy: -spreadY, col: 'rgba(245, 158, 11, 0.55)' },
            { label: 'Молодого',       sub: 'Драйв и скорость', tShow: 8.60,  ox:  spreadX, oy: -spreadY, col: 'rgba(56, 189, 248, 0.55)' },
            { label: 'Харизматичного', sub: 'Энергия лидера',   tShow: 9.60,  ox: -spreadX, oy:  spreadY, col: 'rgba(168, 85, 247, 0.55)' },
            { label: 'И красивого',    sub: 'Лицо проекта',     tShow: 11.15, ox:  spreadX, oy:  spreadY, col: 'rgba(16, 185, 129, 0.55)' }
          ];

          const cardW = Math.min(W * 0.43, 310);
          const cardH = 104;

          traits.forEach((tr) => {
            if (t >= tr.tShow) {
              const pPop = easeOutBack(prog(t, tr.tShow, tr.tShow + 0.45));
              const nx = cx + tr.ox * pPop;
              const ny = cy + tr.oy * pPop;
              drawLivingSpline(cx, cy, nx, ny, pPop * (1 - pMerge), amp, t, tr.col, 2);
              drawAppleCard(nx, ny, cardW, cardH, 26, tr.label, tr.sub, pPop * (1 - pMerge * 0.8), 1 - pMerge, tr.col);
            }
          });

          if (t >= 14.50) {
            drawAppleCard(
              cx, cy,
              Math.min(W * 0.86, 580), 155, 34,
              'Вы его нашли.',
              '100% совпадение с задачами агентства',
              pFound, 1 - prog(t, 15.20, 15.50),
              'rgba(16, 185, 129, 0.65)', 'Event Manager'
            );
          }
        } else {
          // 15.50 - 18.25s: 15 Years Chronograph Wheel outside the card
          const pIn = easeOutBack(prog(t, 15.50, 16.05));
          const pCount = easeOutExpo(prog(t, 15.65, 17.30));
          const pExit = prog(t, 17.90, 18.25);
          const alpha = 1 - pExit;
          const yrs = Math.max(1, Math.round(pCount * 15));

          const wheelAngle = pCount * Math.PI * 3.5 + t * 0.4;
          drawGearWheel(cx, cy, minDim * 0.37 * pIn, 32, wheelAngle, 'rgba(245, 158, 11, 0.65)', alpha, 3);

          drawAppleCard(
            cx, cy,
            Math.min(W * 0.84, 540), 175, 36,
            `${yrs} лет в индустрии`,
            'Богдан Богданов · Сотни проведённых событий',
            pIn, alpha, 'rgba(245, 158, 11, 0.6)', 'Опыт и масштаб'
          );
        }
      }

      // ----------------------------------------------------------------------
      // ACT 3 (18.25s - 28.40s): "Управление людьми" -> 5 Nodes ("Всё вот это")
      // ----------------------------------------------------------------------
      else if (t < 28.40) {
        const pCore = easeOutBack(prog(t, 18.25, 18.80));
        const pExit = prog(t, 28.05, 28.40);
        const alpha = 1 - pExit;

        const hubY = t >= 25.40 ? cy - minDim * 0.21 : cy;
        const hubTitle = t < 21.35 ? 'Управление людьми' : 'Понимаю всё изнутри';
        const hubSub = t < 21.35 ? 'Моя главная стихия' : 'Чтобы никто из подрядчиков не схалтурил';

        drawAppleCard(
          cx, hubY,
          Math.min(W * 0.86, 580), 132, 32,
          hubTitle, hubSub,
          pCore, alpha, 'rgba(56, 189, 248, 0.5)', 'Контроль качества'
        );

        if (t >= 25.45) {
          const skills = [
            { name: 'Видео',      sub: 'Монтаж и ритм', t0: 25.55, col: 'rgba(245, 158, 11, 0.55)' },
            { name: 'Фото',       sub: 'Свет и ракурс', t0: 25.95, col: 'rgba(56, 189, 248, 0.55)' },
            { name: 'Звук и свет',sub: 'Техрайдер',     t0: 26.35, col: 'rgba(168, 85, 247, 0.55)' },
            { name: 'Своя база',  sub: 'DJ и артисты',  t0: 26.75, col: 'rgba(16, 185, 129, 0.55)' },
            { name: 'Нейросети',  sub: 'AI и код',      t0: 27.15, col: 'rgba(244, 63, 94, 0.55)' }
          ];
          const spanX = Math.min(W * 0.90, 960);
          const pillW = Math.min(W * 0.28, 176);
          const pillH = 92;

          skills.forEach((sk, i) => {
            if (t >= sk.t0) {
              const pNode = easeOutBack(prog(t, sk.t0, sk.t0 + 0.42));
              const u = (i / 4) - 0.5;
              const nx = cx + u * spanX * 0.84;
              const ny = cy + minDim * (i % 2 === 0 ? 0.13 : 0.25);

              drawLivingSpline(cx, hubY + 55, nx, ny, pNode, amp, t, sk.col, 2.2);
              drawAppleCard(nx, ny, pillW, pillH, 24, sk.name, sk.sub, pNode, alpha, sk.col);
            }
          });
        }
      }

      // ----------------------------------------------------------------------
      // ACT 4 (28.40s - 34.55s): "Сценарии" -> "Пыль в глаза" Vortex Shatter
      // ----------------------------------------------------------------------
      else if (t < 34.55) {
        if (t < 32.50) {
          dustSpawned = false;
          const pWave = easeOutExpo(prog(t, 28.40, 29.80));
          drawLivingSpline(W * 0.08, cy, W * 0.92, cy, pWave, amp + 0.2, t, '#f59e0b', 3.5);

          const label = t < 30.80 ? 'Обожаю сценарии' : 'Без сценария любой бюджет —';
          drawAppleCard(
            cx, cy,
            Math.min(W * 0.88, 660), 145, 34,
            label, 'Драматургия и режиссура события',
            easeOutBack(prog(t, 28.45, 29.00)), 1.0, 'rgba(245, 158, 11, 0.55)', 'Фундамент'
          );
        } else if (t < 33.28) {
          const pSlam = easeOutBack(prog(t, 32.50, 32.78));
          drawAppleCard(
            cx, cy,
            Math.min(W * 0.88, 680), 175, 38,
            'Пыль в глаза.',
            'Красивая картинка рассыпается без сюжета',
            pSlam, 1.0, 'rgba(245, 158, 11, 0.8)', 'Без драматургии'
          );
        } else {
          if (!dustSpawned) {
            initDustParticles();
            dustSpawned = true;
          }
        }
      }

      // ----------------------------------------------------------------------
      // ACT 5 (34.55s - 47.05s): Quest -> "$10,000" -> NDA RED DOT SYSTEM ERROR!
      // ----------------------------------------------------------------------
      else if (t < 47.05) {
        if (t < 42.15) {
          const pIn = easeOutBack(prog(t, 34.55, 35.15));
          drawGearWheel(cx, cy, minDim * 0.37 * pIn, 28, t * 0.6, 'rgba(56, 189, 248, 0.45)', 0.8, 2.5);

          let mainTxt = 'Иммерсивный квест';
          let subTxt = 'Сценарий полного погружения с нуля';
          if (t >= 40.00) {
            mainTxt = 'За 1 день клиент потратил...';
            subTxt = 'Организация и продакшн под ключ';
          } else if (t >= 38.40) {
            mainTxt = 'Как фильм в реальности';
            subTxt = 'Нанятые профессиональные актёры';
          }

          drawAppleCard(
            cx, cy,
            Math.min(W * 0.88, 660), 165, 34,
            mainTxt, subTxt,
            pIn, 1.0, 'rgba(56, 189, 248, 0.55)', 'Любимый кейс'
          );
        } else if (t < 45.98) {
          const pSpin = easeOutExpo(prog(t, 42.15, 43.45));
          const val = Math.round(pSpin * 10000);
          drawGearWheel(cx, cy, minDim * 0.38, 36, pSpin * Math.PI * 4, 'rgba(16, 185, 129, 0.55)', 0.85, 3);

          const subLabel = t < 44.35
            ? 'Бюджет за один день · Полное погружение'
            : 'Рассказал бы в деталях, но тут...';

          drawAppleCard(
            cx, cy,
            Math.min(W * 0.86, 600), 175, 38,
            '$' + val.toLocaleString('en-US'),
            subLabel,
            1.0, 1.0, 'rgba(16, 185, 129, 0.65)', 'Бюджет проекта'
          );
        } else {
          // >>> 45.98s - 47.05s: NDA SYSTEM ERROR + FULLSCREEN RED DOT EXPANSION ("ТУ-ДУ, БИ-БИП") <<<
          const pErr = prog(t, 45.98, 47.05);
          const pSlam = easeOutBack(prog(t, 45.98, 46.28));
          const pExit = prog(t, 46.82, 47.05);
          const alpha = 1 - pExit;

          // Giant expanding Red Dot across the entire screen!
          const dotRadius = Math.max(W, H) * easeOutExpo(prog(t, 45.98, 46.45)) * 0.85;
          const redGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(20, dotRadius));
          redGrad.addColorStop(0, `rgba(244, 63, 94, ${0.42 * alpha})`);
          redGrad.addColorStop(0.55, `rgba(225, 29, 72, ${0.22 * alpha})`);
          redGrad.addColorStop(1, 'rgba(3, 4, 8, 0)');
          ctx.fillStyle = redGrad;
          ctx.fillRect(0, 0, W, H);

          // Pulsing Red Recording/Alert Beacon Dot at top of card
          const blink = Math.sin((t - 45.98) * 28) > 0 ? 1.0 : 0.35;
          ctx.save();
          ctx.fillStyle = `rgba(244, 63, 94, ${blink * alpha})`;
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = 35;
          ctx.beginPath();
          ctx.arc(cx, cy - 125, 16 * pSlam, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          drawAppleCard(
            cx, cy,
            Math.min(W * 0.86, 620), 175, 36,
            '⛔ NDA · ДОСТУП ЗАКРЫТ',
            'Подписан контракт о неразглашении с заказчиком',
            pSlam, alpha, 'rgba(244, 63, 94, 0.85)', 'SYSTEM ERROR // СЕКРЕТНО'
          );
        }
      }

      // ----------------------------------------------------------------------
      // ACT 6 (47.05s - 55.05s):
      // MEME MOMENT: "Вот этой компанией..." -> [ ? ] -> "Но хочу выйти в этот масштаб" -> LIFEEVENTS_AGENCY
      // ----------------------------------------------------------------------
      else if (t < 55.05) {
        const pExit = prog(t, 54.75, 55.05);
        const alpha = 1 - pExit;

        if (t < 53.30) {
          // 47.05 - 53.30s: Mystery Company Card with Meme Question Marks "[ ? ]"
          const pIn = easeOutBack(prog(t, 47.10, 47.65));
          const pQuestionPop = easeOutBack(prog(t, 49.12, 49.55));
          const wobble = t >= 49.12 ? Math.sin((t - 49.12) * 14) * Math.exp(-(t - 49.12) * 1.8) * 0.08 : 0;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(wobble);
          ctx.translate(-cx, -cy);

          const cardTitle = t < 49.10 ? 'Руководящая должность' : 'Компания « ? ? ? »';
          const cardSub = t < 49.10
            ? 'Сейчас я руковожу вот этой компанией...'
            : 'Имя скрыто, чтобы никто не чувствовал конкуренцию 😉';

          drawAppleCard(
            cx, cy,
            Math.min(W * 0.88, 650), 175, 36,
            cardTitle, cardSub,
            pIn, alpha, 'rgba(245, 158, 11, 0.65)', 'Инкогнито · Действующий бизнес'
          );
          ctx.restore();

          // Floating Meme Question Marks ("? ? ?") popping around the card at 49.15s!
          if (t >= 49.12) {
            const qPositions = [
              { x: cx - Math.min(W * 0.34, 290), y: cy - 75, rot: -0.25, s: 1.1 },
              { x: cx + Math.min(W * 0.34, 290), y: cy - 65, rot:  0.28, s: 1.2 },
              { x: cx - Math.min(W * 0.30, 250), y: cy + 85, rot: -0.18, s: 0.95 },
              { x: cx + Math.min(W * 0.30, 250), y: cy + 80, rot:  0.22, s: 1.05 }
            ];
            qPositions.forEach((qp, qi) => {
              const pq = easeOutBack(prog(t, 49.12 + qi * 0.10, 49.50 + qi * 0.10));
              if (pq > 0.01) {
                ctx.save();
                ctx.translate(qp.x, qp.y + Math.sin(t * 5 + qi) * 8);
                ctx.rotate(qp.rot + Math.sin(t * 4 + qi) * 0.08);
                ctx.scale(pq * qp.s, pq * qp.s);
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 25;
                ctx.font = `900 44px -apple-system, 'Inter', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', 0, 0);
                ctx.restore();
              }
            });
          }
        } else {
          // 53.30 - 55.05s: "В этот масштаб!" -> Full Designation LIFEEVENTS_AGENCY
          const pNodeB = easeOutBack(prog(t, 53.30, 53.85));
          drawGearWheel(cx, cy, minDim * 0.38 * pNodeB, 32, t * 1.4, 'rgba(56, 189, 248, 0.55)', alpha, 3);

          drawAppleCard(
            cx, cy,
            Math.min(W * 0.88, 680), 180, 38,
            'lifeevents_agency',
            'Ольга Бортникова · Масштабные проекты мирового уровня',
            pNodeB, alpha, 'rgba(56, 189, 248, 0.75)', '🎯 ВОТ ЭТОТ МАСШТАБ'
          );
        }
      }

      // ----------------------------------------------------------------------
      // ACT 7 (55.05s - 60.40s): "Быстро учусь" -> "До связи."
      // ----------------------------------------------------------------------
      else if (t < 60.40) {
        if (t < 57.95) {
          const pIn = easeOutBack(prog(t, 55.05, 55.55));
          const pOut = prog(t, 57.60, 57.95);
          drawAppleCard(
            cx, cy,
            Math.min(W * 0.86, 620), 160, 34,
            'Быстро учусь',
            'Открыт новому и готов включаться на 100%',
            pIn, 1 - pOut, 'rgba(16, 185, 129, 0.6)', 'Готовность к работе'
          );
        } else {
          const pIn = easeOutBack(prog(t, 57.95, 58.35));
          const pFold = easeInOutCubic(prog(t, 59.95, 60.38));
          const alpha = 1 - pFold;

          drawGearWheel(cx, cy, minDim * 0.33 * pIn, 24, t * 1.1, 'rgba(245, 158, 11, 0.5)', alpha, 2.5);
          drawAppleCard(
            cx, cy,
            Math.min(W * 0.80, 500), 150, 36,
            'До связи.',
            '',
            pIn, alpha, 'rgba(245, 158, 11, 0.65)'
          );
        }
      }

      // Update Dust Particles
      for (let i = dustParticles.length - 1; i >= 0; i--) {
        const p = dustParticles[i];
        const dx = p.x - cx, dy = p.y - cy;
        const dist = Math.hypot(dx, dy) + 1;
        p.vx += (-dy / dist) * 0.32 + (dx / dist) * 0.12;
        p.vy += (dx / dist) * 0.32 + (dy / dist) * 0.12;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
          dustParticles.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${p.life})`;
        ctx.fill();
      }

      requestAnimationFrame(renderCinema);
    }

    function launchShow() {
      if (launchOverlay.style.display === 'none') return;
      launchOverlay.style.opacity = '0';
      launchOverlay.style.filter = 'blur(24px)';
      setTimeout(() => { launchOverlay.style.display = 'none'; }, 650);
      dustSpawned = false;
      bgMusic.volume = 0.30;
      bgMusic.currentTime = 24.5; // Jump right into the warm beat drop of Stage Spotlight!
      bgMusic.play().catch(() => {});
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    btnLaunchPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      launchShow();
    });
    launchOverlay.addEventListener('click', launchShow);

    // Click anywhere on canvas during playback to pause/resume both tracks synchronously
    document.body.addEventListener('click', (e) => {
      if (launchOverlay.style.display !== 'none') return;
      if (e.target.closest('button') || e.target.closest('a')) return;
      if (audio.paused) {
        if (audio.currentTime >= TOTAL_DURATION - 0.2) {
          dustSpawned = false;
          audio.currentTime = 0;
        }
        bgMusic.volume = 0.30;
        bgMusic.play().catch(() => {});
        audio.play().catch(() => {});
      } else {
        audio.pause();
        bgMusic.pause();
      }
    });

    audio.addEventListener('ended', () => {
      // Keep bgMusic softly playing at 18% on the final contact portal
      bgMusic.volume = 0.18;
    });

    document.getElementById('btn-replay-end').addEventListener('click', () => {
      dustSpawned = false;
      finalPortal.classList.remove('active');
      bgMusic.volume = 0.30;
      bgMusic.currentTime = 24.5;
      bgMusic.play().catch(() => {});
      audio.currentTime = 0;
      audio.play().catch(() => {});
    });

    document.getElementById('btn-copy-tg').addEventListener('click', () => {
      const tg = '@bogdan_act';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tg).catch(() => {});
      } else {
        const ta = document.createElement('textarea');
        ta.value = tg;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const toast = document.getElementById('toast-msg');
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2200);
    });

    requestAnimationFrame(renderCinema);
  </script>
</body>
</html>
